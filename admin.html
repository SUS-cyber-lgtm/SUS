<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SUS Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#09111d;color:#e8f1fb;font-family:Arial,sans-serif}
.wrap{max-width:1050px;margin:auto;padding:28px 18px}h1{margin:0 0 6px}.sub{color:#91a7bd;margin-bottom:22px}
.panel{background:#101d2d;border:1px solid #29415c;border-radius:16px;padding:20px;margin-bottom:18px}
.path{display:flex;gap:7px;align-items:center;flex-wrap:wrap;background:#0b1725;border:1px solid #29415c;padding:12px;border-radius:12px;margin-bottom:18px}
.path button{background:#142941;color:#dff1ff;border:1px solid #315273;border-radius:8px;padding:7px 10px;cursor:pointer;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
button,input{font:inherit}.action{padding:11px 14px;border:0;border-radius:9px;cursor:pointer;font-weight:700}
.add{background:#1d8b5a;color:#fff}.secondary{background:#20344a;color:#e5f1ff}.danger{background:#7c2930;color:#fff}
input{width:100%;padding:11px 12px;border-radius:9px;border:1px solid #35506c;background:#0b1725;color:#fff}
.list{display:grid;gap:9px;margin-top:15px}.row{display:flex;align-items:center;gap:10px;background:#0b1725;border:1px solid #263f58;border-radius:11px;padding:11px}
.row .name{flex:1;font-weight:700}.row small,.note{color:#8197ad}.empty{padding:10px 0}
</style>
</head>
<body>
<div class="wrap">
<h1>🔐 SUS ADMIN</h1><div class="sub">Gestione di SitiUfficialiSportivi</div>
<div class="panel"><div class="path" id="path"></div><div id="actions" class="grid"></div></div>
<div class="panel"><h2 id="title">🏠 Sport</h2><div id="list" class="list"></div></div>
<div class="panel"><h2>Aggiungi</h2><div class="grid">
<input id="name" placeholder="Nome"><input id="emoji" placeholder="Emoji (facoltativa)">
<input id="url" placeholder="Link sito ufficiale (solo torneo)">
</div><br><button class="action add" id="add">＋ Aggiungi</button>
<p class="note">Il pannello segue automaticamente il percorso corrente. Struttura: Sport → Nazione/Circuito → Torneo → Sito ufficiale.</p></div>
<div class="panel note"><b>Nota:</b> questa versione salva i dati nel browser. Non contiene password o token GitHub.</div>
</div>
<script>
const KEY="SUS_ADMIN_DATA_V1";
let data=JSON.parse(localStorage.getItem(KEY)||"null")||[
{id:"calcio",type:"sport",name:"Calcio",emoji:"⚽"},
{id:"italia",type:"region",name:"Italia",emoji:"🇮🇹",parent:"calcio"},
{id:"serie-a",type:"tournament",name:"Serie A",emoji:"🏆",parent:"italia",url:"https://www.legaseriea.it/"}
],path=[];
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function get(id){return data.find(x=>x.id===id)}
function children(parent){return data.filter(x=>parent?x.parent===parent:!x.parent)}
function uid(n){return n.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")+"-"+Date.now()}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function current(){return path.length?get(path[path.length-1]):null}
function render(){
let p=document.getElementById("path");
p.innerHTML='<button onclick="goHome()">🏠 SUS</button>'+(path.length?'<span>›</span>':'')+
path.map((id,i)=>{let x=get(id);return '<button onclick="go('+i+')">'+esc(x.emoji||"")+' '+esc(x.name)+'</button>'+(i<path.length-1?'<span>›</span>':'')}).join("");
let cur=current(),kids=children(cur?.id);
document.getElementById("title").textContent=cur?(cur.emoji||"")+" "+cur.name:"🏠 Sport";
document.getElementById("actions").innerHTML='<span class="note">'+(!cur?"Qui puoi creare gli Sport.":cur.type==="sport"?"Qui puoi creare Nazione / Circuito.":cur.type==="region"?"Qui puoi creare Tornei.":"Questo è il livello del sito ufficiale.")+'</span>';
let list=document.getElementById("list");
list.innerHTML=kids.length?kids.map(x=>'<div class="row"><div class="name">'+esc(x.emoji||"")+' '+esc(x.name)+'</div><small>'+({sport:"Sport",region:"Nazione / Circuito",tournament:"Torneo"}[x.type])+'</small><button class="action secondary" onclick="openItem(\''+x.id+'\')">Apri</button><button class="action secondary" onclick="editItem(\''+x.id+'\')">Modifica</button><button class="action danger" onclick="deleteItem(\''+x.id+'\')">Elimina</button></div>').join(""):'<div class="empty">Nessuna voce in questa cartella.</div>';
}
function goHome(){path=[];render()} function go(i){path=path.slice(0,i+1);render()}
function openItem(id){let x=get(id);if(x.type==="tournament"){if(x.url)window.open(x.url,"_blank");else alert("Questo torneo non ha ancora un sito ufficiale.");}else{path.push(id);render()}}
function editItem(id){let x=get(id),n=prompt("Nome:",x.name);if(n===null)return;if(!n.trim())return alert("Nome non valido.");x.name=n.trim();let e=prompt("Emoji:",x.emoji||"");if(e!==null)x.emoji=e.trim();if(x.type==="tournament"){let u=prompt("Link sito ufficiale:",x.url||"");if(u!==null)x.url=u.trim()}save();render()}
function deleteItem(id){let x=get(id);if(!confirm('Eliminare "'+x.name+'"?'))return;let remove=new Set([id]),changed=true;while(changed){changed=false;data.forEach(y=>{if(y.parent&&remove.has(y.parent)&&!remove.has(y.id)){remove.add(y.id);changed=true}})}data=data.filter(y=>!remove.has(y.id));path=path.filter(i=>!remove.has(i));save();render()}
document.getElementById("add").onclick=()=>{
let name=document.getElementById("name").value.trim(),emoji=document.getElementById("emoji").value.trim(),url=document.getElementById("url").value.trim(),cur=current(),type,parent=null;
if(!name)return alert("Inserisci il nome.");
if(!cur)type="sport";else if(cur.type==="sport"){type="region";parent=cur.id}else if(cur.type==="region"){type="tournament";parent=cur.id;if(!url)return alert("Inserisci il link del sito ufficiale.");if(!/^https?:\/\//i.test(url))return alert("Il link deve iniziare con http:// o https://")}else return alert("Un torneo contiene solo il suo sito ufficiale.");
data.push({id:uid(name),type,name,emoji:emoji||(type==="sport"?"⚽":type==="region"?"🌍":"🏆"),...(parent?{parent}:{}),...(type==="tournament"?{url}:{})});save();["name","emoji","url"].forEach(i=>document.getElementById(i).value="");render()};
render();
</script>
</body></html>
